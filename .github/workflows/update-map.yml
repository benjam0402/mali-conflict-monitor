name: Update Sahel Conflict Monitor

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

concurrency:
  group: update-sahel-conflict-monitor
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    env:
      LOOKBACK_DAYS: '14'
      RETENTION_DAYS: '45'
      MIN_DAYS_DELAY: '2'
      COORD_DECIMALS: '3'
      MAX_PUBLISHED_EVENTS: '250'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run daily update
        run: python tools/update_daily.py

      - name: Validate generated data
        run: python tools/validate_data.py

      - name: Commit updated data
        run: |
          git config user.name "sahel-map-bot"
          git config user.email "actions@github.com"
          git add data/events.geojson data/events.csv data/review_candidates.csv data/source_log.json data/social_watch.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "Update public media signals"
          git pull --rebase origin main
          git push
